[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paintweave"
version = "1.0.0"
description = "Open-Source Procedural Geometry (SOP) & Shader (VOP) Node Studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "PaintWeave Contributors" }
]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "PySide6>=6.6.0",
    "NodeGraphQt>=0.6.0",
    "moderngl>=5.8.0",
    "PyGLM>=2.7.0",
    "pyqtgraph>=0.13.3",
    "Pillow>=10.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]

[project.gui-scripts]
paintweave = "paintweave.main:main"

[project.scripts]
paintweave-cli = "paintweave.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/paintweave"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

# --- NVIDIA RTX CUDA PyTorch Wheel Configuration (Windows / Linux) ---
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]
